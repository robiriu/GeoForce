# GeoForce v2.0 simulation campaign — parameter-space specification.
#
# Bounds drawn from initial/PLAN.md §2B (Indonesian field range) and
# data/indonesia/parameters.yaml (per-field calibration). LHS is applied
# over these 12 dimensions; integer-valued dims are sampled in continuous
# space and rounded.

dimensions:

  base_temperature_C:
    min: 200.0
    max: 350.0
    unit: C
    note: Reservoir-zone target temperature; geothermal_gradient_C_per_km derived from this.

  base_pressure_bar:
    min: 20.0
    max: 120.0
    unit: bar
    note: Reservoir-zone hydrostatic seed; Waiwera self-iterates to consistency.

  log10_permeability_m2:
    min: -16.0
    max: -12.0
    unit: log10(m^2)
    note: Effective (fracture-dominated) reservoir permeability for the campaign sweep.

  porosity:
    min: 0.01
    max: 0.15
    unit: fraction
    note: Reservoir matrix porosity; caprock and basement lower (set in scenario expander).

  reservoir_top_depth_m:
    min: 500.0
    max: 3000.0
    unit: m
    note: Top of producing zone below surface.

  heat_source_depth_m:
    min: 3000.0
    max: 6000.0
    unit: m
    note: Depth to magmatic heat source; sets the basal heat-flux BC.

  injection_rate_kg_s:
    min: 0.0
    max: 100.0
    unit: kg/s
    note: Per-well mass injection rate.

  production_rate_kg_s:
    min: 10.0
    max: 150.0
    unit: kg/s
    note: Per-well mass extraction rate.

  n_production_wells:
    min: 1
    max: 8
    unit: count
    integer: true

  n_injection_wells:
    min: 0
    max: 4
    unit: count
    integer: true

  rock_thermal_conductivity_W_mK:
    min: 1.5
    max: 4.0
    unit: W/(m K)

  initial_steam_saturation:
    min: 0.0
    max: 1.0
    unit: fraction
    note: 0 = liquid-dominated, 1 = vapor-dominated; intermediate values seed two-phase.

# ─── Output spec (recorded in PLAN-V2 §2 Phase 3) ──────────────────────────
output_variables:
  - temperature_C
  - pressure_Pa
  - steam_saturation
  - specific_enthalpy_kJ_kg
  - liquid_density_kg_m3

timestep_years: [1, 3, 5, 7, 10, 13, 16, 20, 25, 30]

# Integer-coded layer properties used by simulation/grid.py — defaults
# applied unless overridden by an LHS sample.
default_layers:
  caprock:
    permeability_m2: 1.0e-17
    porosity: 0.02
    thermal_conductivity_W_mK: 2.0
  basement:
    permeability_m2: 1.0e-18
    porosity: 0.01
    thermal_conductivity_W_mK: 2.5
